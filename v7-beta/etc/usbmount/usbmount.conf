ENABLED=1
MOUNTPOINTS="/media/usb0 /media/usb1 /media/usb2 /media/usb3 /media/usb4 /media/usb5 /media/usb6 /media/usb7"
FILESYSTEMS="vfat ext2 ext3 ext4 hfsplus ntfs ntfs-3g fuseblk exfat"
MOUNTOPTIONS="ro,noexec,nodev,noatime,nodiratime"
FS_MOUNTOPTIONS="-fstype=vfat,gid=users,dmask=0007,fmask=0117 -fstype=ntfs-3g,nls=utf8,umask=007,gid=users -fstype=fuseblk,nls=utf8,umask=007,gid=users"
VERBOSE=no
