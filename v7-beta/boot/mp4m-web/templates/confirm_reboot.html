{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}MP4Museum - Reboot{% endblock %}
{% block container_class %}narrow-page{% endblock %}

{% block content %}
<h2>Reboot needed</h2>
<p>Reboot the player for the change to take effect.</p>
<div class="button-row">
  <button class="button primary" onclick="reboot(false)">{{ icon('power') }}<span>Reboot Now</span></button>
  <a href="{{ url_for('index') }}" class="button ghost">Later</a>
</div>
{% endblock %}
